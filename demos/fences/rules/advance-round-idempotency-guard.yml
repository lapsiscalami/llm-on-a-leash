id: advance-round-idempotency-guard
language: TypeScript
severity: error
message: "advanceToNextRound has lost its idempotency guard. Restore the `if (game.currentRound >= nextRoundNumber) return;` early-return."
note: |
  ABSENCE ASSERTION. This rule matches the whole file when it does NOT
  contain a function named advanceToNextRound whose body holds the guard.

  The guard is required INSIDE that function, not merely somewhere in the
  file: checking "the file mentions the function" and "the file contains
  the guard" as two separate facts passes when the guard has migrated to
  a sibling function, which is exactly the refactor this fence exists for.

  Round advance can be scheduled from multiple triggers near a boundary
  (last-answer judgment + host clicking Finish Round). Removing this guard
  reintroduces the double-advance race, where a game skips a round.

  A unit test proves the guard WORKS. Nothing but this proves it EXISTS.
rule:
  kind: program
  not:
    has:
      stopBy: end
      kind: function_declaration
      all:
        - has:
            field: name
            regex: "^advanceToNextRound$"
        - has:
            stopBy: end
            pattern: if ($GAME.currentRound >= $NEXT) return;
files:
  - "demos/fences/guarded/rounds.ts"
