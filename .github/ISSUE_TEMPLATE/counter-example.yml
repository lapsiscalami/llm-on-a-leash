name: Counter-example
description: A pattern here didn't hold on your model or your prompt.
title: "[counter-example] "
labels: ["counter-example"]
body:
  - type: markdown
    attributes:
      value: |
        A pattern failing somewhere I didn't test is as useful as a new pattern. It goes into the caveats; it won't be quietly dropped.
  - type: input
    id: pattern
    attributes:
      label: Pattern
      description: Which PATTERNS.md entry.
      placeholder: "e.g. entry 1, deal from a deck"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model, how you ran it, and temperature
      placeholder: "e.g. phi-4-mini via llama.cpp, T=0.7"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the guide led you to expect
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead
      description: Numbers if you have them, with how many items or calls.
    validations:
      required: true
  - type: textarea
    id: replies
    attributes:
      label: Saved replies or prompt
      description: Link to the raw replies, and to the prompt if you can share it. Verbatim model output only.
